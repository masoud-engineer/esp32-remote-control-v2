<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#07111f">
  <title>ESP32 V2 | Secure Access</title>
  <style>
    :root{color-scheme:dark;--bg:#07111f;--panel:#101e30;--line:#20344d;--muted:#8fa4bd;--text:#edf5ff;--accent:#42d6a4;--blue:#69a9ff}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:radial-gradient(ellipse at 15% 10%,#17334b 0,transparent 42%),radial-gradient(ellipse at 90% 90%,#123b3b 0,transparent 35%),var(--bg);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif;color:var(--text)}
    .shell{width:min(100%,440px)}
    .brand{display:flex;align-items:center;gap:12px;margin:0 0 26px}
    .mark{width:44px;height:44px;border:1px solid #31506d;border-radius:13px;display:grid;place-items:center;background:#12263a;color:var(--accent);font-size:22px}
    .brand strong{display:block;font-size:16px;letter-spacing:.04em}.brand span{color:var(--muted);font-size:12px}
    .card{padding:30px;border:1px solid var(--line);border-radius:22px;background:linear-gradient(145deg,rgba(20,38,59,.97),rgba(12,25,41,.97));box-shadow:0 24px 80px #0007}
    .eyebrow{color:var(--accent);font-size:11px;font-weight:750;letter-spacing:.16em;text-transform:uppercase}
    h1{font-size:28px;line-height:1.2;margin:10px 0}
    .intro{margin:0 0 26px;color:var(--muted)}
    label{display:block;margin:0 0 8px;font-size:13px;font-weight:650}
    input{width:100%;height:52px;padding:0 15px;border:1px solid #2b4561;border-radius:12px;background:#091625;color:var(--text);font:inherit;outline:none}
    input:focus{border-color:var(--blue);box-shadow:0 0 0 3px #69a9ff22}
    button{width:100%;height:52px;margin-top:14px;border:0;border-radius:12px;background:var(--accent);color:#05251c;font:700 15px system-ui;cursor:pointer}
    button:disabled{opacity:.6;cursor:wait}
    .result{display:none;margin-top:18px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;font-size:13px;overflow-wrap:anywhere}
    .result.show{display:block}.result.ok{border-color:#26775e;background:#0b2c27;color:#aaf4d8}.result.bad{border-color:#82434b;background:#321a22;color:#ffc0c5}
    .meta{display:flex;justify-content:space-between;gap:12px;margin-top:22px;padding-top:18px;border-top:1px solid var(--line);color:var(--muted);font-size:11px}
    .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--accent);margin-right:7px}
    .foot{text-align:center;margin:18px 0 0;color:#71869e;font-size:11px}
    @media(max-width:480px){.card{padding:24px}.brand{margin-bottom:20px}h1{font-size:25px}}
  </style>
</head>
<body>
  <main class="shell">
    <div class="brand">
      <div class="mark" aria-hidden="true">⌁</div>
      <div><strong>ESP32 REMOTE CONTROL</strong><span>VERSION 2 · DEVICE MANAGEMENT</span></div>
    </div>
    <section class="card">
      <div class="eyebrow">Private dashboard</div>
      <h1>Secure access</h1>
      <p class="intro">Sign in with your private access code to verify the V2 authentication service.</p>
      <form id="loginForm">
        <label for="accessCode">Dashboard access code</label>
        <input id="accessCode" type="password" autocomplete="current-password" placeholder="Enter your access code" required minlength="12">
        <button id="submitBtn" type="submit">Verify and sign in</button>
      </form>
      <div id="result" class="result" role="status" aria-live="polite"></div>
      <div class="meta"><span><i class="dot"></i>Secure connection</span><span>Cloud API · V2</span></div>
    </section>
    <p class="foot">Your access code is sent securely to the V2 API and is not saved by this page.</p>
  </main>
  <script>
    const form = document.getElementById("loginForm");
    const codeInput = document.getElementById("accessCode");
    const button = document.getElementById("submitBtn");
    const result = document.getElementById("result");

    form.addEventListener("submit", async (event) => {
      event.preventDefault();
      const accessCode = codeInput.value;
      button.disabled = true;
      button.textContent = "Verifying…";
      result.className = "result show";
      result.textContent = "Connecting securely to the V2 authentication service…";

      try {
        const response = await fetch("https://esp32-remote-control-v2-api.masoudsubi.workers.dev/api/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ accessCode })
        });
        const data = await response.json();

        if (response.ok && data.token) {
          result.className = "result show ok";
          result.textContent = "✓ Login successful. Your access code is accepted and the V2 session service is working. Session duration: " + data.expiresIn + " seconds. The session token was not saved or displayed.";
        } else {
          result.className = "result show bad";
          result.textContent = "Login not accepted (" + response.status + "): " + (data.error || "Please check the access code and try again.");
        }
      } catch (error) {
        result.className = "result show bad";
        result.textContent = "Could not reach the API. Check your internet connection, GitHub Pages URL, and API CORS configuration.";
      } finally {
        codeInput.value = "";
        button.disabled = false;
        button.textContent = "Verify and sign in";
      }
    });
  </script>
</body>
</html>
