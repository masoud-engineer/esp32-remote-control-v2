name: IoT Platform Frontend CI

on:
  push:
    branches:
      - platform-foundation
    paths:
      - "platform/**"
      - ".github/workflows/platform-frontend-ci.yml"
  pull_request:
    branches:
      - platform-foundation
    paths:
      - "platform/**"
      - ".github/workflows/platform-frontend-ci.yml"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out isolated frontend branch
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check JavaScript module syntax
        run: |
          node --input-type=module --check < platform/app.js
          node --input-type=module --check < platform/config.js
      - name: Verify required portal files and security boundaries
        run: |
          test -s platform/index.html
          test -s platform/styles.css
          test -s platform/app.js
          test -s platform/config.js
          ! grep -R -E "service_role|SUPABASE_SERVICE_ROLE|CLOUDFLARE_API_TOKEN|EMQX_APP_SECRET" platform/
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const html = readFileSync('platform/index.html', 'utf8');
          const js = readFileSync('platform/app.js', 'utf8');
          const required = [
            'accept-invitation-form',
            'invitation-token'
          ];
          for (const id of required) {
            if (!html.includes('id="' + id + '"')) throw new Error('Missing portal control: ' + id);
            if (!js.includes(id)) throw new Error('No application handler for: ' + id);
          }
          if (html.includes('redeem-device-claim-form') || js.includes('/api/device-claims/redeem')) {
            throw new Error('Legacy user-operated device activation must remain removed.');
          }
          for (const marker of ['physical ESP32', 'one-time commissioning code', 'Register a device', '/api/organizations/', 'Create 30-minute enrollment code']) {
            if (!js.includes(marker)) throw new Error('Missing device enrollment behavior: ' + marker);
          }
          for (const marker of ['Registered devices', '/devices', 'Issue enrollment code']) {
            if (!js.includes(marker)) throw new Error('Missing device inventory behavior: ' + marker);
          }
          console.log('Portal invitation, device registration and physical-only enrollment boundaries verified.');
          NODE
